apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ford-nexus-api
  namespace: ford-nexus
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.fordnexus.example
      secretName: ford-nexus-tls
  rules:
    - host: api.fordnexus.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ford-nexus-api
                port:
                  name: http
