apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ford-nexus-api
  namespace: ford-nexus
spec:
  podSelector:
    matchLabels:
      app: ford-nexus-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
